<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <meta name="description"
      content="Retrouvez les espaces de travail ProSpace Solutions sauvegardés et comparez rapidement leur capacité, leur note et leur tarif horaire.">
    <title>Mes espaces de travail sauvegardés | ProSpace Solutions</title>
    <link rel="icon" href="../assets/favicon/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon/favicon.svg" sizes="any">
    <link rel="icon" type="image/png" href="../assets/favicon/favicon-32x32.png" sizes="32x32">
    <link rel="icon" type="image/png" href="../assets/favicon/favicon-16x16.png" sizes="16x16">
    <link rel="apple-touch-icon" href="../assets/favicon/apple-touch-icon.png" sizes="180x180">
    <link rel="stylesheet" href="../assets/css/main.css">
  </head>

  <body>
    <a class="logo" href="#page-accueil">Aller à la page d'accueil</a>

    <!-- Zone  HEADER : Cette div reçoit le fichier header.html chargé par commun.js. -->
    <div id="conteneur-header"></div>

    <main class="page-espaces-sauvegardes conteneur" id="haut-de-page">
      <div class="page-espaces-sauvegardes__en-tete">
        <div>
          <h1>Mes Espaces Sauvegardés</h1>
          <p id="resume-selection">Chargement de votre sélection…</p>
        </div>
        <button class="bouton bouton--danger" type="button" id="vider-selection" hidden>
          <img src="../assets/icons/icone-supprimer.svg" alt="">
          Vider ma sélection
        </button>
      </div>

      <!-- Section : Aucun favori -->
      <section class="panneau-etat page-espaces-sauvegardes__etat-vide" id="selection-vide" hidden>
        <span class="page-espaces-sauvegardes__icone-vide">
          <img src="../assets/icons/icone-favori.svg" alt="">
        </span>
        <h2 id="titre-selection-vide">Aucun espace sauvegardé</h2>
        <p>
          Ajoutez des espaces à vos favoris depuis le catalogue en cliquant sur l'icône
          <img class="page-espaces-sauvegardes__coeur-integre" src="../assets/icons/icone-favori.svg" alt="cœur">.
        </p>
      </section>

      <!-- Section : Favoris sauvegardés -->
      <section id="conteneur-selection" hidden>
        <h2 class="visuellement-cache" id="titre-liste-selection">Liste de mes espaces sauvegardés</h2>
        <div class="liste-espaces-sauvegardes" id="liste-selection"></div>
      </section>
    </main>

    <!-- Zone FOOTER : Cette div reçoit le fichier footer.html chargé par commun.js. -->
    <div id="conteneur-footer"></div>

    <!-- Zone JAVASCRIPT : Ces scripts sont placés en fin de page et activent la structure commune puis les interactions propres à la page. -->
    <script src="../assets/js/commun.js"></script>
    <script src="../assets/js/mes-espaces.js"></script>
  </body>
</html>
